name: Bug report
description: Something behaves differently from the documentation.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Requests, commands or a minimal program. Remove credentials.
      render: shell
  - type: input
    id: version
    attributes:
      label: Glider version or commit
    validations:
      required: true
  - type: input
    id: store
    attributes:
      label: Object store
      placeholder: AWS S3 (region), MinIO (version), local directory
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and /v1/status output
      render: text
