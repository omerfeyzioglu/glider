name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Test benchmark archive tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check generated benchmark summary
        run: |
          python3 tools/benchmarks.py summary --check
          python3 tools/benchmarks.py summary --archive benchmarks/filtering --check

      - name: Check S3 feature
        run: |
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

      - name: Run isolated MinIO integration tests
        run: python3 tools/test_s3.py --benchmark-smoke target/backend-smoke --search-smoke target/search-s3-smoke

      - name: Validate dedicated compaction workload and counter repeatability
        run: |
          python3 tools/compaction_benchmark.py --label "CI runner; caches and competing load uncontrolled" --output target/compaction-first.json
          python3 tools/compaction_benchmark.py --label "CI runner; caches and competing load uncontrolled" --output target/compaction-repeat.json
          python3 tools/benchmarks.py compare target/compaction-first.json target/compaction-repeat.json --check-counters > target/compaction-comparison.json

      - name: Validate search matrix and exact oracle
        run: python3 tools/search_benchmark.py --smoke --label "CI runner; caches and competing load uncontrolled" --output target/search-smoke

      - name: Validate short exact versus IVF comparison
        run: python3 tools/ann_benchmark.py --smoke --output target/ann-smoke

      - name: Validate filtered exact versus IVF quality
        run: python3 tools/filter_benchmark.py --smoke --output target/filter-smoke

      - name: Retain benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            target/backend-smoke/*.json
            target/compaction-*.json
            target/search-smoke/*.json
            target/search-s3-smoke/*.json
            target/ann-smoke/*.json
            target/ann-smoke/SUMMARY.md
            target/filter-smoke/*.json
            target/filter-smoke/SUMMARY.md
          if-no-files-found: ignore
