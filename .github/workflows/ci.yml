name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Test benchmark archive tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check generated benchmark summary
        run: |
          python3 tools/benchmarks.py summary --check
          python3 tools/benchmarks.py summary --archive benchmarks/filtering --check

      - name: Check S3 and segmented features
        run: |
          cargo clippy --all-targets --all-features --locked -- -D warnings
          # Release mode: the crash-point matrices take minutes unoptimized.
          cargo test --release --all-features --locked

  minio:
    # Disposable-MinIO integration, fault and benchmark smoke checks; runs in
    # parallel with the fast checks above.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Run isolated MinIO integration tests
        run: python3 tools/test_s3.py --benchmark-smoke target/backend-smoke --search-smoke target/search-s3-smoke

      - name: Validate dedicated compaction workload and counter repeatability
        run: |
          python3 tools/compaction_benchmark.py --label "CI runner; caches and competing load uncontrolled" --output target/compaction-first.json
          python3 tools/compaction_benchmark.py --label "CI runner; caches and competing load uncontrolled" --output target/compaction-repeat.json
          python3 tools/benchmarks.py compare target/compaction-first.json target/compaction-repeat.json --check-counters > target/compaction-comparison.json

      - name: Validate search matrix and exact oracle
        run: python3 tools/search_benchmark.py --smoke --label "CI runner; caches and competing load uncontrolled" --output target/search-smoke

      - name: Validate short exact versus IVF comparison
        run: python3 tools/ann_benchmark.py --smoke --output target/ann-smoke

      - name: Validate filtered exact versus IVF quality
        run: python3 tools/filter_benchmark.py --smoke --output target/filter-smoke

      - name: Verify serial serving, recovery and backup smoke
        run: python3 tools/m13_soak.py target/serving-smoke --smoke

      - name: Verify bounded provider pilot on MinIO
        run: |
          cargo test --locked --features s3 --example s3_pilot
          python3 tools/s3_pilot.py target/s3-pilot --minio

      - name: Verify bounded concurrent admission
        run: |
          cargo test --locked --features s3 --example m16_concurrency
          python3 tools/m16_benchmark.py target/m16-comparison --smoke

      - name: Verify capacity workload and recovery smoke
        run: python3 tools/m19_benchmark.py target/m19-study --smoke --m20

      - name: Retain benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            target/minio-diagnostics/*.jsonl
            target/backend-smoke/*.json
            target/compaction-*.json
            target/search-smoke/*.json
            target/search-s3-smoke/*.json
            target/ann-smoke/*.json
            target/ann-smoke/SUMMARY.md
            target/filter-smoke/*.json
            target/filter-smoke/SUMMARY.md
            target/serving-smoke/*.json
            target/s3-pilot/*.json
            target/m16-comparison/*.json
            target/m19-study/**/*.json
          if-no-files-found: ignore
