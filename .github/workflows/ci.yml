name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Test benchmark archive tooling
        run: python3 -m unittest discover -s tests -p 'test_benchmarks.py'

      - name: Check generated benchmark summary
        run: python3 tools/benchmarks.py summary --check

      - name: Check S3 feature
        run: |
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

      - name: Run isolated MinIO integration tests
        run: python3 tools/test_s3.py --benchmark-smoke target/backend-smoke
