[package]
name = "glider"
version = "1.0.0"
edition = "2021"
rust-version = "1.98.1"
authors = ["Ömer Feyzioğlu"]
description = "Single-node vector database with S3 as the authoritative store and a local SSD cache"
repository = "https://github.com/omerfeyzioglu/glider"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["vector-database", "vector-search", "ann", "s3", "object-storage"]
categories = ["database-implementations", "database"]

[features]
default = []
s3 = ["dep:object_store", "dep:tokio", "dep:futures", "dep:async-trait"]
# HTTP service binary over the segmented engine.
server = ["s3", "dep:axum", "tokio/signal", "tokio/macros"]

[dependencies]
object_store = { version = "0.14.1", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
getrandom = "0.2"
zstd = { version = "0.13", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "original-uri"], optional = true }

[dev-dependencies]
bytes = "1"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "baseline"
harness = false

[[example]]
name = "m13_soak"
required-features = ["s3"]

[[example]]
name = "s3_pilot"
required-features = ["s3"]

[[example]]
name = "m16_concurrency"
required-features = ["s3"]

[[example]]
name = "m19_capacity"
required-features = ["s3"]

[[example]]
name = "m22_capacity"
required-features = ["s3"]

[[example]]
name = "m23_cache"
required-features = ["s3"]

[[example]]
name = "m24_layout_probe"

[[example]]
name = "m24_acceptance"
required-features = ["s3"]

[[example]]
name = "m30_filter_probe"

[[bin]]
name = "glider-server"
required-features = ["server"]

[[bin]]
name = "glider-admin"
required-features = ["server"]
