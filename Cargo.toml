[package]
name = "glider"
version = "0.1.0"
edition = "2021"

[features]
default = []
s3 = ["dep:object_store", "dep:tokio", "dep:futures", "dep:async-trait"]

[dependencies]
object_store = { version = "0.14.1", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[bench]]
name = "baseline"
harness = false
