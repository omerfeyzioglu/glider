[package]
name = "glider"
version = "0.1.0"
edition = "2021"

[features]
default = []
experimental-segmented = []
s3 = ["dep:object_store", "dep:tokio", "dep:futures", "dep:async-trait"]

[dependencies]
object_store = { version = "0.14.1", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
getrandom = "0.2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[[bench]]
name = "baseline"
harness = false

[[example]]
name = "m13_soak"
required-features = ["s3"]

[[example]]
name = "s3_pilot"
required-features = ["s3"]

[[example]]
name = "m16_concurrency"
required-features = ["s3"]

[[example]]
name = "m19_capacity"
required-features = ["s3"]

[[example]]
name = "m22_capacity"
required-features = ["s3", "experimental-segmented"]

[[example]]
name = "m23_cache"
required-features = ["s3", "experimental-segmented"]

[[example]]
name = "m24_layout_probe"
required-features = ["experimental-segmented"]
